[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so-paint-mcp"
version = "0.1.0"
description = "Local CLI painting workbench for SO-101: camera reconstruction, kinematics, trajectories and visual feedback"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.10,<3",
    "pillow>=11,<13",
    "rerun-sdk>=0.37.1,<0.38",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
so-paint = "so_paint.cli:main"

[project.optional-dependencies]
hardware = [
    "lerobot[feetech]==0.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# runs/ is session output, including scratch analysis scripts. Not project source.
# extend-, so ruff's own defaults (.venv and friends) stay excluded too.
extend-exclude = ["runs"]

[tool.hatch.build.targets.wheel]
packages = ["src/so_paint"]

# LeRobot's dataset viewer pins an older Rerun. We use only its hardware API;
# so-paint owns visualization and requires the headless renderer in 0.37.
[tool.uv]
override-dependencies = ["rerun-sdk>=0.37.1,<0.38"]
